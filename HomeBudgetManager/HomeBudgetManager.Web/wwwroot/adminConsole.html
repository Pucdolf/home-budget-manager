<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Panel finansowy</title>
    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="/css/adminConsole.css">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>
<body>

    <div class="layout">
        <!-- Pasek boczny -->
        <aside class="sidebar">
            <p class="sidebar-title">Mój budżet</p>
            <span class="user-name">Zalogowano jako: {username}</span>
            <button class="sidebar-link" onclick="window.location.href='/dashboard'">Pulpit</button>
            <button class="sidebar-link" onclick="window.location.href='/household'">Domostwo</button>
            <button class="sidebar-link" onclick="window.location.href='/calendar'">Kalendarz</button>
            <button class="sidebar-link" onclick="window.location.href='/charts'">Wykresy</button>
            <button class="sidebar-link" onclick="window.location.href='/reports'">Raporty</button>
            <button class="sidebar-link" onclick="window.location.href='/new-transaction?returnUrl=' + encodeURIComponent(window.location.pathname)">Transakcje</button>
            <button class="sidebar-link" onclick="window.location.href='/adminConsole'">Ustawienia Admina</button>
            <form method="post" action="/logout" style="display:inline;">
                <button type="submit" class="btn-logout">Wyloguj</button>
            </form>
        </aside>

        <main class="admin-container">
            <h1>Konsola SQL (Bezpośredni dostęp)</h1>
            <p>Wpisz zapytanie SQL poniżej. </p>
            
            <form hx-post="/admin/execute-sql" hx-target="#query-results" hx-indicator="#loading">
                <textarea name="sqlQuery" class="sql-editor" placeholder="Np. SELECT * FROM Users"></textarea>
                <br>
                <button type="submit" class="btn-run">Wykonaj Zapytanie</button>
                <span id="loading" class="htmx-indicator">Wykonywanie...</span>
            </form>

            <div id="query-results">
                </div>
        </main>
    </div>
</body>
