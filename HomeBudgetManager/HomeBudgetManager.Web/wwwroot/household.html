<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Domostwo</title>

    <!-- Twoje style aplikacji (sidebar/layout) -->
    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="/css/householdView.css">
    
    <!-- Ikony -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>

<body>
    <div class="layout">
        <aside class="sidebar">
            <p class="sidebar-title">Mój budżet</p>
            <span class="user-name">Zalogowano jako: {username}</span>

            <button class="sidebar-link" onclick="window.location.href='/dashboard'">Pulpit</button>
            <button class="sidebar-link active" onclick="window.location.href='/household'">Domostwo</button>
            <button class="sidebar-link" onclick="window.location.href='/calendar'">Kalendarz</button>
            <button class="sidebar-link" onclick="window.location.href='/charts'">Wykresy</button>
            <button class="sidebar-link" onclick="window.location.href='/reports'">Raporty</button>
            <button class="sidebar-link" onclick="window.location.href='/new-transaction'">Transakcje</button>
            {admin_panel_button}
            <form method="post" action="/logout" style="display:inline;">
                <button type="submit" class="btn-logout">Wyloguj</button>
            </form>
        </aside>

        <main class="container" id="household-main" 
              hx-get="/dashboard-household" 
              hx-trigger="load" 
              hx-swap="innerHTML">
            <!-- Tutaj załaduje się widok domostwa -->
            <p style="text-align:center; padding: 2rem;">Ładowanie domostwa...</p>
        </main>
    </div>
</body>
</html>
