<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Panel finansowy</title>
    <link rel="stylesheet" href="/css/dashboard.css">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>
<body>

    <div class="layout">
        <!-- Pasek boczny -->
        <aside class="sidebar">
            <p class="sidebar-title">Mój budżet</p>
            <span class="user-name">Zalogowano jako: {username}</span>
            <button class="sidebar-link" onclick="loadDashboard()">Pulpit</button>
            <button class="sidebar-link" onclick="loadHousehold()">Domostwo</button>
            <button class="sidebar-link" onclick="window.location.href='/calendar'">Kalendarz</button>
            <button class="sidebar-link" onclick="window.location.href='/charts'">Wykresy</button>
            <form method="post" action="/logout" style="display:inline;">
                <button type="submit" class="btn-logout">Wyloguj</button>
            </form>
        </aside>

        <main class="container" id="dashboard-main">
            <section class="card">
                <h2>Przegląd finansów</h2>
                <p class="card-desc">
                    Prototyp panelu do podglądu stanu finansów.
                </p>

                <div class="balance-box">
                    <p class="balance-label">Saldo konta</p>
                    <span class="balance-highlight">{balance} zł</span>
                </div>

                <div id="dashboard-charts" 
                     hx-get="/dashboard/charts" 
                     hx-trigger="load">
                     <p style="text-align:center; color:#888;">Ładowanie wykresów...</p>
                </div>

                <div class="actions-box">
                    <a href="/new-transaction" class="btn-primary">Dodaj transakcję</a>
                </div>

                <div class="transactions-box">
                    <h3>Ostatnie transakcje</h3>
                    <ul class="transactions-list"
                        id="transactions-list"
                        hx-get="/transactions/listsome"
                        hx-trigger="load"
                        hx-swap="innerHTML">
                        <li class='transaction-item'>
                            <div class='transaction-main'>
                                <span>Ładowanie transakcji...</span>
                            </div>
                        </li>
                    </ul>
                </div>
            </section>
        </main>
    </div>

    <script>
        function loadHousehold() {
            fetch("/dashboard-household")
                .then(res => res.text())
                .then(html => {
                    document.getElementById("dashboard-main").innerHTML = html;
                    if (window.htmx) htmx.process(document.getElementById("dashboard-main"));
                })
                .catch(err => {
                    document.getElementById("dashboard-main").innerHTML = "<p>Błąd ładowania domostwa.</p>";
                });
        }

        function loadDashboard() {
            location.reload();
        }

        // NOWA funkcja – ładowanie widoku kalendarza
        function loadCalendar() {
            fetch("/calendar")
                .then(res => res.text())
                .then(html => {
                    document.getElementById("dashboard-main").innerHTML = html;
                })
                .catch(err => {
                    document.getElementById("dashboard-main").innerHTML = "<p>Błąd ładowania kalendarza.</p>";
                });
        }
    </script>

    <script>
        document.body.addEventListener('htmx:afterSwap', function (event) {
            if (event.detail.target.id === 'form-response') {
                const response = event.detail.target.innerHTML;
                if (response.includes('success')) {
                    // Odśwież listę transakcji
                    htmx.trigger('#transactions-list', 'load');
                    // Odśwież saldo
                    htmx.trigger('#balance-container', 'load');

                    setTimeout(() => {
                        document.getElementById('transaction-modal').style.display = 'none';
                        document.querySelector('form').reset();
                        document.getElementById('form-response').innerHTML = '';
                    }, 1500);
                }
            }
        });
    </script>

</body>
</html>
