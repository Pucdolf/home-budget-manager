<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Panel finansowy</title>
    <link rel="stylesheet" href="/css/dashboard.css">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>
<body>

    <div class="layout">
        <!-- Pasek boczny -->
        <aside class="sidebar">
            <p class="sidebar-title">Mój budżet</p>
            <span class="user-name">Zalogowano jako: {username}</span>
            <button class="sidebar-link" onclick="loadDashboard()">Pulpit</button>
            <button class="sidebar-link" onclick="window.location.href='/household'">Domostwo</button>
            <button class="sidebar-link" onclick="window.location.href='/calendar'">Kalendarz</button>
            <button class="sidebar-link" onclick="window.location.href='/charts'">Wykresy</button>
            <button class="sidebar-link" onclick="window.location.href='/reports'">Raporty</button>
            <form method="post" action="/logout" style="display:inline;">
                <button type="submit" class="btn-logout">Wyloguj</button>
            </form>
        </aside>

        <main class="container" id="dashboard-main">
            <section class="card">
                <h2>Przegląd finansów</h2>
                <p class="card-desc">
                    Prototyp panelu do podglądu stanu finansów.
                </p>

                <div class="dashboard-grid">
                    <!-- Lewa kolumna: Bilans i Wykresy -->
                    <div class="dashboard-center-column">
                        <div class="balance-box">
                            <p class="balance-label">Saldo konta</p>
                            <span class="balance-highlight">{balance} zł</span>
                        </div>

                        <div id="dashboard-charts" 
                             hx-get="/dashboard/charts" 
                             hx-trigger="load">
                             <p style="text-align:center; color:#888;">Ładowanie wykresów...</p>
                        </div>

                        <div class="actions-box">
                            <a href="/new-transaction" class="btn-primary">Dodaj transakcję</a>
                        </div>
                    </div>

                    <!-- Prawa kolumna: Lista transakcji -->
                    <div class="dashboard-right-column">
                        <div class="transactions-box">
                            <h3>Ostatnie transakcje</h3>
                            <ul class="transactions-list"
                                id="transactions-list"
                                hx-get="/transactions/listsome"
                                hx-trigger="load"
                                hx-swap="innerHTML">
                                <li class='transaction-item'>
                                    <div class='transaction-main'>
                                        <span>Ładowanie transakcji...</span>
                                    </div>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script>
        function loadHousehold() {
            fetch("/dashboard-household")
                .then(res => res.text())
                .then(html => {
                    document.getElementById("dashboard-main").innerHTML = html;
                    if (window.htmx) htmx.process(document.getElementById("dashboard-main"));
                })
                .catch(err => {
                    document.getElementById("dashboard-main").innerHTML = "<p>Błąd ładowania domostwa.</p>";
                });
        }

        function loadDashboard() {
            location.reload();
        }

        // NOWA funkcja – ładowanie widoku kalendarza
        function loadCalendar() {
            fetch("/calendar")
                .then(res => res.text())
                .then(html => {
                    document.getElementById("dashboard-main").innerHTML = html;
                })
                .catch(err => {
                    document.getElementById("dashboard-main").innerHTML = "<p>Błąd ładowania kalendarza.</p>";
                });
        }
    </script>

    <script>
        document.body.addEventListener('htmx:afterSwap', function (event) {
            if (event.detail.target.id === 'form-response') {
                const response = event.detail.target.innerHTML;
                if (response.includes('success')) {
                    // Odśwież listę transakcji
                    htmx.trigger('#transactions-list', 'load');
                    // Odśwież saldo
                    htmx.trigger('#balance-container', 'load');

                    setTimeout(() => {
                        document.getElementById('transaction-modal').style.display = 'none';
                        document.querySelector('form').reset();
                        document.getElementById('form-response').innerHTML = '';
                    }, 1500);
                }
            }
        });
    </script>

    <!-- Add Event Modal (Used for Edit in Dashboard) -->
    <div class="modal" id="event-modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>Edytuj Transakcję</h2> <!-- Changed title to generic/edit -->

            <form id="event-form">
                <div class="form-group">
                    <label for="event-amount">Kwota</label>
                    <input type="number" step="0.01" id="event-amount" required>
                </div>

                <div class="form-group">
                    <label for="event-date">Data</label>
                    <input type="date" id="event-date" required>
                </div>

                <!-- Hidden time fields if not used, or keep them if backend requires -->
                <div class="form-group time-group" style="display:none;">
                    <div>
                        <label for="event-start-time">Start Time</label>
                        <input type="time" id="event-start-time">
                    </div>
                    <div>
                        <label for="event-end-time">End Time</label>
                        <input type="time" id="event-end-time">
                    </div>
                </div>

                <div class="form-group">
                    <label for="event-description">Opis</label>
                    <textarea id="event-description" rows="3"></textarea>
                </div>

                <!-- Color ignored for now -->
                <div class="form-group" style="display:none;">
                    <label for="event-color">Color</label>
                    <select id="event-color">
                        <option value="#4e73df">Blue</option>
                    </select>
                </div>

                <button type="submit" class="save-btn">Zapisz</button>
            </form>
        </div>
    </div>

    <!-- Event Details Modal -->
    <div class="modal" id="event-details-modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2 id="details-title">Kwota</h2>
            <div class="event-details">
                <p><i class="fas fa-calendar-day"></i> <span id="details-date">Data</span></p>
                <!-- Time hidden -->
                <p style="display:none;"><i class="fas fa-clock"></i> <span id="details-time">Czas</span></p>
                <p><i class="fas fa-align-left"></i> <span id="details-description">Opis</span></p>
            </div>
            <div class="event-actions">
                <button id="edit-event-btn">Edytuj</button>
                <button id="delete-event-btn">Usuń</button>
                <button id="close-details-btn">Zamknij</button>
            </div>
        </div>
    </div>

    <script src="/js/dashboard-transactions.js"></script>
</body>
</html>
