<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Dołącz do domostwa</title>
    <script src="https://unpkg.com/htmx.org@1.9.2"></script>
    <link rel="stylesheet" href="/css/dashboard.css">
    <script>
        // Automatyczne wypełnienie pola kodu z adresu URL (?code=XYZ)
        window.onload = () => {
            const params = new URLSearchParams(window.location.search);
            const code = params.get('code');
            if (code) {
                document.getElementById('join-code').value = code;
            }
        };
    </script>
</head>
<body>
    <main class="container">
        <section class="card">
            <h2>Dołącz do istniejącego domostwa</h2>

            <form hx-post="/join-household" hx-target="#result" class="space-y-4">
                <input id="join-code" type="text" name="code" placeholder="Kod domostwa" required class="border p-2 w-full" />
                <button type="submit" class="btn-primary">Dołącz</button>
            </form>

            <div id="result" class="mt-4"></div>

            <div class="mt-4">
                <a href="/dashboard" class="btn-secondary">← Powrót</a>
            </div>
        </section>
    </main>
</body>
</html>
